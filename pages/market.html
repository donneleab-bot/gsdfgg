<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#060000">
    <title>✦ FENBO | Рынок ✦ 18+</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700;900&family=Lora:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           БАЗА (то же, что в base.css)
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        html { scroll-behavior: smooth; }

        body {
            background-color: #080000;
            background-image: 
                radial-gradient(ellipse at 15% 0%, rgba(180, 0, 0, 0.5) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 100%, rgba(140, 0, 60, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 60%, rgba(255, 180, 0, 0.05) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255, 215, 0, 0.015) 40px, rgba(255, 215, 0, 0.015) 41px);
            background-attachment: fixed;
            font-family: 'Lora', serif;
            color: #E8D8C8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 40px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.98) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .spotlight {
            position: fixed;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 200%; height: 70vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 220, 120, 0.25) 0%, rgba(255, 200, 80, 0.14) 20%, rgba(200, 0, 0, 0.08) 45%, transparent 75%);
            filter: blur(50px);
            animation: spotlightPulse 6s ease-in-out infinite;
        }
        @keyframes spotlightPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        .neon-left, .neon-right {
            position: fixed;
            top: 20%;
            width: 40%; height: 60vh;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.5;
        }
        .neon-left { left: -10%; background: radial-gradient(ellipse at 100% 50%, rgba(180, 0, 60, 0.4) 0%, transparent 70%); animation: neonPulseL 8s ease-in-out infinite; }
        .neon-right { right: -10%; background: radial-gradient(ellipse at 0% 50%, rgba(255, 0, 60, 0.35) 0%, transparent 70%); animation: neonPulseR 9s ease-in-out infinite; }
        @keyframes neonPulseL { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        @keyframes neonPulseR { 0%, 100% { opacity: 0.7; } 50% { opacity: 0.3; } }

        .smoke {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 80%, rgba(180, 60, 60, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 35% at 80% 30%, rgba(120, 0, 60, 0.14) 0%, transparent 70%),
                radial-gradient(ellipse 45% 30% at 50% 100%, rgba(255, 180, 80, 0.1) 0%, transparent 70%);
            filter: blur(60px);
            animation: smokeDrift 20s ease-in-out infinite alternate;
        }
        @keyframes smokeDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -20px) scale(1.1); } }

        .dust-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .dust-bg .mote {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 180, 1) 0%, rgba(255, 215, 0, 0.8) 40%, transparent 100%);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.7), 0 0 16px rgba(255, 200, 80, 0.4);
            opacity: 0;
            animation: moteFloat linear infinite;
        }
        @keyframes moteFloat {
            0% { opacity: 0; transform: translate3d(0, 0, 0); }
            20% { opacity: 0.9; } 80% { opacity: 0.6; }
            100% { opacity: 0; transform: translate3d(var(--mx, 30px), -100vh, 0); }
        }

        /* ============================================
           ШАПКА
           ============================================ */
        .topbar-wrap { width: 100%; max-width: 1600px; position: relative; z-index: 20; padding: 0 45px; }
        .topbar {
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 40px;
            padding: 22px 0;
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.18);
        }
        .topbar::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.4) 20%, rgba(255, 215, 0, 0.6) 50%, rgba(255, 215, 0, 0.4) 80%, transparent 100%);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }
        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.75rem;
            font-weight: 900;
            color: #FFD700;
            letter-spacing: 10px;
            text-decoration: none;
            text-shadow: 0 0 22px rgba(255, 215, 0, 0.6), 0 0 45px rgba(180, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 1);
            display: flex;
            align-items: baseline;
            white-space: nowrap;
        }
        .logo .sub {
            font-family: 'Great Vibes', cursive;
            font-size: 1.05rem;
            color: #FF4444;
            letter-spacing: 2px;
            margin-left: 10px;
            text-shadow: 0 0 18px rgba(255, 0, 0, 0.7);
            font-weight: 400;
        }
        .topbar-nav {
            display: flex;
            justify-content: center;
            gap: 42px;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .topbar-nav a {
            color: rgba(232, 216, 200, 0.55);
            text-decoration: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            position: relative;
            padding: 6px 0;
            white-space: nowrap;
        }
        .topbar-nav a::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .topbar-nav a:hover, .topbar-nav a.active { color: #FFD700; text-shadow: 0 0 18px rgba(255, 215, 0, 0.8); }
        .topbar-nav a:hover::after, .topbar-nav a.active::after { transform: translateX(-50%) scaleX(1); }

        .topbar-user { display: flex; align-items: center; gap: 12px; justify-content: flex-end; position: relative; }
        .wallet {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 14px 6px 6px;
            background: linear-gradient(135deg, rgba(70, 0, 0, 0.9) 0%, rgba(30, 0, 0, 0.85) 100%);
            border: 1.5px solid rgba(255, 215, 0, 0.55);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), inset 0 1px 0 rgba(255, 215, 0, 0.2), inset 0 -1px 0 rgba(0, 0, 0, 0.5);
        }
        .wallet:hover { border-color: #FFD700; box-shadow: 0 0 35px rgba(255, 215, 0, 0.6); transform: translateY(-2px); }
        .wallet .chip-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #FFF6C8 0%, #FFE066 15%, #FFD700 35%, #D4AF37 65%, #8B6914 100%);
            border: 2px solid #FFE066;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9), inset 0 -4px 8px rgba(120, 80, 0, 0.6), inset 0 4px 8px rgba(255, 255, 255, 0.4);
            position: relative;
            flex-shrink: 0;
        }
        .wallet .chip-icon::after { content: '♠'; font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 900; color: #1A0505; }
        .wallet .balance { display: flex; flex-direction: column; line-height: 1.1; min-width: 78px; }
        .wallet .chips { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; color: #FFD700; letter-spacing: 1.5px; display: flex; align-items: baseline; gap: 3px; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
        .wallet .chips .unit { font-size: 0.62rem; color: rgba(255, 215, 0, 0.8); letter-spacing: 2px; }
        .wallet .usdt { font-family: 'Cormorant Garamond', serif; font-size: 0.78rem; font-style: italic; color: rgba(197, 160, 89, 1); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
        .wallet .usdt .usdt-icon { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; background: #26A17B; border-radius: 50%; color: #FFF; font-family: 'Cinzel', serif; font-size: 0.65rem; font-weight: 700; font-style: normal; }
        .wallet .plus { width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 215, 0, 0.12); border: 1.5px solid rgba(255, 215, 0, 0.7); display: flex; align-items: center; justify-content: center; color: #FFD700; font-size: 1rem; font-weight: 700; line-height: 1; transition: all 0.4s; flex-shrink: 0; }
        .wallet:hover .plus { background: #FFD700; color: #1A0505; transform: rotate(90deg); }

        .topbar-user .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2B0A0A, #4A0505);
            border: 1.5px solid rgba(255, 215, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: #FFD700;
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.35), inset 0 0 12px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.4s;
        }
        .topbar-user .avatar:hover { box-shadow: 0 0 32px rgba(255, 215, 0, 0.85); transform: scale(1.05); border-color: #FFD700; }

        /* ============================================
           HERO РЫНКА
           ============================================ */
        .market-hero {
            width: 100%;
            max-width: 1600px;
            padding: 60px 45px 30px;
            text-align: center;
            position: relative;
            z-index: 5;
        }
        .market-hero .hero-topline {
            display: inline-flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 20px;
        }
        .market-hero .line-s {
            width: 80px; height: 1px;
            background: linear-gradient(90deg, transparent, #FFD700, #FF4444);
        }
        .market-hero .line-s.r { background: linear-gradient(270deg, transparent, #FFD700, #FF4444); }
        .market-hero .suits {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #FFD700;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
        }
        .market-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 10px;
            color: #FF4444;
            border: 1px solid rgba(255, 68, 68, 0.65);
            padding: 10px 22px;
            text-transform: uppercase;
            background: rgba(180, 0, 0, 0.18);
            text-shadow: 0 0 18px rgba(255, 0, 0, 0.7);
            margin-bottom: 26px;
            box-shadow: 0 0 30px rgba(180, 0, 0, 0.5);
        }
        .market-hero .hero-badge::before { content: '18'; font-size: 0.75rem; color: #FFF; background: #FF0000; padding: 3px 7px; border-radius: 3px; letter-spacing: 0; }
        .market-hero .hero-badge::after { content: '♠'; color: #FF4444; font-size: 0.85rem; }
        .market-hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            color: #FFD700;
            letter-spacing: 20px;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 
                0 0 20px rgba(0, 0, 0, 1), 0 0 45px rgba(0, 0, 0, 0.9), 0 0 70px rgba(255, 215, 0, 0.65),
                0 0 120px rgba(180, 0, 0, 0.8), 0 5px 0 rgba(120, 80, 0, 1), 0 8px 12px rgba(0, 0, 0, 1);
        }
        .market-hero h1 span {
            font-family: 'Great Vibes', cursive;
            font-size: 3.4rem;
            color: #FF4444;
            letter-spacing: 2px;
            text-transform: none;
            margin-left: 20px;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.9), 0 0 60px rgba(180, 0, 0, 0.7);
        }
        .market-hero p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-style: italic;
            color: #C5A059;
            letter-spacing: 4px;
            margin-top: 24px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 1);
        }
        .market-hero p .accent {
            color: #FF4444;
            font-style: normal;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }
        .market-hero .hero-cta {
            display: inline-flex;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-hero {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            padding: 16px 34px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-hero.primary {
            color: #1A0505;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 1px solid #FFD700;
            font-weight: 700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.6);
        }
        .btn-hero.primary:hover {
            background: linear-gradient(135deg, #FFFFFF, #FFD700);
            box-shadow: 0 0 55px rgba(255, 215, 0, 1);
            letter-spacing: 6px;
        }
        .btn-hero.ghost {
            color: #FFD700;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 215, 0, 0.6);
        }
        .btn-hero.ghost:hover {
            background: #FFD700;
            color: #1A0505;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
        }

        /* ============================================
           КАЗИНО-СТАТИСТИКА
           ============================================ */
        .casino-stats {
            width: 100%;
            max-width: 1600px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 30px 45px 0;
            position: relative;
            z-index: 5;
        }
        .casino-stat {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(60, 0, 0, 0.5) 0%, rgba(20, 0, 0, 0.4) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        .casino-stat::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.12), transparent);
            transition: left 0.8s;
        }
        .casino-stat:hover::before { left: 100%; }
        .casino-stat:hover { border-color: rgba(255, 215, 0, 0.7); box-shadow: 0 0 25px rgba(255, 215, 0, 0.35); transform: translateY(-3px); }
        .casino-stat .stat-icon {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.2), rgba(120, 0, 0, 0.4));
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #FFD700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
            flex-shrink: 0;
        }
        .casino-stat .stat-body { display: flex; flex-direction: column; line-height: 1.2; }
        .casino-stat .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
        }
        .casino-stat .stat-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.72rem;
            font-style: italic;
            color: rgba(197, 160, 89, 0.85);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ============================================
           ЛЕНТА АКТИВНОСТИ (как «горячие ставки»)
           ============================================ */
        .activity-feed {
            width: 100%;
            max-width: 1600px;
            margin: 20px auto 0;
            padding: 0 45px;
            position: relative;
            z-index: 5;
        }
        .activity-inner {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px 24px;
            background: linear-gradient(90deg, rgba(180, 0, 0, 0.2) 0%, rgba(60, 0, 0, 0.3) 50%, rgba(180, 0, 0, 0.2) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .activity-inner::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, #FF4444, #FFD700, #FF4444);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.8);
        }
        .activity-label {
            font-family: 'Cinzel', serif;
            font-size: 0.68rem;
            letter-spacing: 4px;
            color: #FF4444;
            text-transform: uppercase;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 20px;
            border-right: 1px solid rgba(212, 175, 55, 0.25);
        }
        .activity-label .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #FF0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 1);
            animation: livePulse 1.5s ease-in-out infinite;
        }
        @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
        .activity-track {
            display: flex;
            gap: 40px;
            overflow: hidden;
            flex: 1;
            white-space: nowrap;
        }
        .activity-item {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.92rem;
            font-style: italic;
            color: rgba(232, 216, 200, 0.85);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: activityScroll 40s linear infinite;
        }
        .activity-item .who { color: #FFD700; font-style: normal; font-weight: 600; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
        .activity-item .what { color: #FF4444; font-style: normal; font-weight: 700; text-shadow: 0 0 12px rgba(255, 0, 0, 0.7); }
        .activity-item .suit { color: #FFD700; }
        @keyframes activityScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* ============================================
           ФИЛЬТРЫ И ПОИСК
           ============================================ */
        .market-controls {
            width: 100%;
            max-width: 1600px;
            padding: 30px 45px 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 5;
        }
        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 280px;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            color: #E8D8C8;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-style: italic;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .search-input::placeholder { color: rgba(197, 160, 89, 0.6); }
        .search-icon {
            position: absolute;
            top: 50%; left: 20px;
            transform: translateY(-50%);
            color: #FFD700;
            font-size: 1rem;
            pointer-events: none;
        }
        .sort-select {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            color: #FFD700;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sort-select:hover, .sort-select:focus { border-color: #FFD700; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
        .sort-select option { background: #1A0505; color: #E8D8C8; }

        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-chip {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(232, 216, 200, 0.7);
            padding: 9px 20px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            cursor: pointer;
